[project]
name = "uganda-learning-predictor"
version = "0.1.0"
description = "Predicts the average learning score of children in Ugandan villages (regression notebook, FastAPI service, Flutter app)."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "python-multipart>=0.0.33",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "seaborn>=0.13.2",
]
