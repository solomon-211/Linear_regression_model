[project]
name = "student-grade-predictor"
version = "1.0.0"
description = "Predicts a university student's second-semester grade (0-20) and serves the model through a FastAPI service."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.4",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.3",
    "python-multipart>=0.0.33",
    "scikit-learn==1.9.1", # must match the version used to save best_model.pkl
    "pandas>=3.1.1",
    "numpy>=2.5.4",
    "joblib>=1.6.0",
]

[dependency-groups]
# Notebook and testing tools (not installed on Render)
dev = [
    "matplotlib",
    "seaborn",
    "jupyter",
    "nbconvert",
    "nbformat",
    "ipykernel",
    "httpx",
]

[tool.uv]
package = false
