[project]
name = "rwanda-food-price-api"
version = "0.1.0"
description = "FastAPI service that predicts next month's retail food price per kg in Rwandan markets and refugee camps."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "python-multipart>=0.0.33",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
